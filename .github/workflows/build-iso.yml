name: Build BharatOS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["config/**", "auto/**", ".github/workflows/build-iso.yml"]

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - name: Build ISO in Debian trixie
        run: |
          sudo docker run --rm --privileged -v "$PWD":/build -w /build debian:trixie bash -c '
            set -e
            apt-get update
            apt-get install -y live-build debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools dosfstools ca-certificates curl
            lb clean --purge || true
            lb config
            lb build
            ls -lh *.iso
          '

      - name: Name the ISO
        run: |
          ISO=$(ls *.iso | head -1)
          sudo mv "$ISO" BharatOS-1.0-amd64.iso
          sha256sum BharatOS-1.0-amd64.iso | tee BharatOS-1.0-amd64.iso.sha256

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: BharatOS-1.0-amd64
          path: |
            BharatOS-1.0-amd64.iso
            BharatOS-1.0-amd64.iso.sha256
          retention-days: 30
          compression-level: 0

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
